<div class="smarttextfield single" id="#{smartDivId}">
	<div id="#{hintDivId}" style="#{hintTextStyle}" class="hint-text oblique truncating-text">#{hintText}</div>
	<div tabindex="0" id="#{writeDivId}" name="#{inputName}" class="editable" x-palm-text-entry="#{modifierState}" maxLength="#{maxLength}" #{steMode}></div>
	<input id="#{divPrefix}_hiddenInput" maxLength="#{maxLength}" type="hidden" />
</div>
